name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy api
        type: boolean
        default: true
      deploy_web:
        description: Deploy web
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  docker:
    name: Build ${{ matrix.app }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image: open-support-api
          - app: web
            dockerfile: apps/web/Dockerfile
            image: open-support-web

    steps:
      - name: Check if app should deploy
        id: gate
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            should_run="${{ github.event_name != 'workflow_dispatch' || inputs.deploy_api }}"
          else
            should_run="${{ github.event_name != 'workflow_dispatch' || inputs.deploy_web }}"
          fi
          echo "run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trigger Dokploy deployment
        if: steps.gate.outputs.run == 'true'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ matrix.app == 'api' && secrets.DOKPLOY_API_WEBHOOK_URL || secrets.DOKPLOY_WEB_WEBHOOK_URL }}
        run: |
          if [ -z "${DOKPLOY_WEBHOOK_URL}" ]; then
            echo "Dokploy webhook URL is not configured; skipping Dokploy deployment trigger."
            exit 0
          fi

          curl -fsSL -X GET "${DOKPLOY_WEBHOOK_URL}"
